services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bagheerasdream-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bagheerasdream-web:latest
    container_name: bagheerasdream-web
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=BagheerasDreamDb;User Id=${APP_DB_USER};Password=${APP_DB_PASSWORD};TrustServerCertificate=True"
      AdminUser__Email: ${ADMIN_EMAIL}
      AdminUser__Password: ${ADMIN_PASSWORD}
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERT_PASSWORD}
    volumes:
      - uploaded_images:/app/wwwroot/uploads
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
      - ./secrets/dataprotection.pfx:/app/secrets/dataprotection.pfx:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sqlserver_data:
  uploaded_images:
  dataprotection_keys: