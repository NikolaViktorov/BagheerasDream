services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bagheerasdream-web:latest
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=BagheerasDreamDb;User Id=${APP_DB_USER};Password=${APP_DB_PASSWORD};TrustServerCertificate=True"
      AdminUser__Email: ${ADMIN_EMAIL}
      AdminUser__Password: ${ADMIN_PASSWORD}
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERT_PASSWORD}
    volumes:
      - uploaded_images:/app/wwwroot/uploads
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
      - ./secrets/dataprotection.pfx:/app/secrets/dataprotection.pfx:ro
    restart: unless-stopped
    networks:
      - backend
      - proxy

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - proxy

volumes:
  sqlserver_data:
  uploaded_images:
  dataprotection_keys:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  proxy:
    driver: bridge